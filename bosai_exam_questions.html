<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>防災士試験問題</title>


<style>

/* ==========================================================
   全体
   ========================================================== */

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;
}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;

    background: #f3f4f6;

    color: #222;

    line-height: 1.7;
}


/* ==========================================================
   メインコンテナ
   ========================================================== */

.container {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding: 20px;
}


/* ==========================================================
   ヘッダー
   ========================================================== */

.header {

    background: #ffffff;

    border-radius: 10px;

    padding: 18px 22px;

    margin-bottom: 15px;

    box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.08);
}


.header h1 {

    margin:
        0 0 5px 0;

    font-size: 24px;

    line-height: 1.4;
}


.progress {

    font-size: 14px;

    color: #666;
}


/* ==========================================================
   問題カード
   ========================================================== */

.question-card {

    background: #ffffff;

    border-radius: 10px;

    padding: 25px;

    box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.08);
}


/* ==========================================================
   問題番号
   ========================================================== */

.question-number {

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 15px;
}


/* ==========================================================
   問題文
   ========================================================== */

.question-text {

    font-size: 18px;

    line-height: 1.9;

    margin-bottom: 25px;

    white-space: pre-wrap;
}


/* ==========================================================
   選択肢
   ========================================================== */

.choice {

    display: flex;

    align-items: flex-start;

    width: 100%;

    padding: 14px 16px;

    margin-bottom: 10px;

    border:
        1px solid #dddddd;

    border-radius: 8px;

    background: #fafafa;

    font-size: 16px;

    line-height: 1.7;
}


.choice-number {

    flex:
        0 0 35px;

    font-weight: bold;
}


.choice-text {

    flex: 1;

    white-space: pre-wrap;
}


/* ==========================================================
   正解
   ========================================================== */

.correct-answer {

    margin-top: 20px;

    padding: 12px 15px;

    border-radius: 8px;

    background: #e8f5e9;

    border:
        1px solid #a5d6a7;

    color: #1b5e20;

    font-size: 17px;

    font-weight: bold;
}


/* ==========================================================
   コピー
   ========================================================== */

.copy-button {

    width: 100%;

    margin-top: 15px;

    padding: 13px 20px;

    border: none;

    border-radius: 8px;

    background: #1976d2;

    color: #ffffff;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


.copy-button:hover {

    background: #1565c0;
}


.copy-button.copied {

    background: #388e3c;
}


/* ==========================================================
   ナビゲーション
   ========================================================== */

.navigation {

    display: flex;

    gap: 10px;

    margin-top: 15px;
}


.navigation button {

    flex: 1;

    padding: 13px 15px;

    border: none;

    border-radius: 8px;

    background: #333333;

    color: #ffffff;

    font-size: 15px;

    cursor: pointer;
}


.navigation button:hover {

    background: #555555;
}


.navigation button:disabled {

    opacity: 0.35;

    cursor: default;
}


/* ==========================================================
   問題番号ジャンプ
   ========================================================== */

.jump-area {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-top: 15px;

    padding-top: 15px;

    border-top:
        1px solid #eeeeee;
}


.jump-area label {

    font-size: 14px;

    white-space: nowrap;
}


.jump-area select {

    flex: 1;

    padding: 9px;

    border:
        1px solid #cccccc;

    border-radius: 6px;

    background: #ffffff;

    font-size: 15px;
}


/* ==========================================================
   スマホ
   ========================================================== */

@media (max-width: 600px) {

    .container {

        padding: 10px;
    }


    .header {

        padding: 15px;
    }


    .header h1 {

        font-size: 21px;
    }


    .question-card {

        padding: 18px;
    }


    .question-number {

        font-size: 19px;
    }


    .question-text {

        font-size: 17px;
    }


    .choice {

        font-size: 15px;

        padding: 12px;
    }


    .correct-answer {

        font-size: 16px;
    }


    .navigation {

        flex-direction: column;
    }


    .navigation button {

        width: 100%;
    }
}


/* ==========================================================
   印刷
   ========================================================== */

@media print {

    body {

        background: #ffffff;
    }


    .header,
    .question-card {

        box-shadow: none;
    }


    .copy-button,
    .navigation,
    .jump-area {

        display: none;
    }
}

</style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         ヘッダー
         ===================================================== -->

    <div class="header">

        <h1>
            防災士試験問題
        </h1>

        <div
            id="progress"
            class="progress">
        </div>

    </div>


    <!-- =====================================================
         問題カード
         ===================================================== -->

    <div class="question-card">


        <!-- 問題番号 -->

        <div
            id="questionNumber"
            class="question-number">
        </div>


        <!-- 問題文 -->

        <div
            id="questionText"
            class="question-text">
        </div>


        <!-- 選択肢 -->

        <div id="choices"></div>


        <!-- =================================================
             正解
             ※コピー対象外
             ================================================= -->

        <div
            id="correctAnswer"
            class="correct-answer">
        </div>


        <!-- =================================================
             コピー
             ================================================= -->

        <button
            id="copyButton"
            class="copy-button"
            onclick="copyQuestion()">

            問題をコピー

        </button>


        <!-- =================================================
             前後移動
             ================================================= -->

        <div class="navigation">

            <button
                id="prevButton"
                onclick="previousQuestion()">

                ← 前の問題

            </button>


            <button
                id="nextButton"
                onclick="nextQuestion()">

                次の問題 →

            </button>

        </div>


        <!-- =================================================
             問題番号ジャンプ
             ================================================= -->

        <div class="jump-area">

            <label for="jumpSelect">

                問題番号：

            </label>


            <select
                id="jumpSelect"
                onchange="jumpToQuestion(this.value)">
            </select>

        </div>


    </div>


</div>


<script>

/* ==========================================================
   問題データ
   ========================================================== */

const questions = [{"question_number": 1, "question": "海溝型地震と内陸地震に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "活断層の活動による内陸直下の地震は、一般的に震源が浅いため、地表は激しく揺れ、局所的であるが甚大な災害を引き起こす。"}, {"id": 2, "text": "海溝型の巨大地震は、発生間隔が比較的長い。M8クラスの南海トラフ沿いの地震は800～1000年間隔で起きている。"}, {"id": 3, "text": "海のプレートと陸のプレートとの境界で起きる地震は、マグニチュード3～4規模のものに限られる。"}], "correct_answer": 1}, {"question_number": 2, "question": "気象庁で定められている震度階級に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "震度階級は0～20までの21段階である。"}, {"id": 2, "text": "震度階級は0～7まであるが、5と6はそれぞれ強と弱に分けられているので、全部で10段階ある。"}, {"id": 3, "text": "震度階級は地震エネルギーの強さと地表の揺れの強さを掛け合わせた方程式で算出される。"}], "correct_answer": 2}, {"question_number": 3, "question": "長周期地震動に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "ゆったりとした揺れをもたらす地震動は、周期が数秒から十数秒と長く「長周期地震動」と呼ばれており、津波を誘発することが多い。"}, {"id": 2, "text": "地震の震源からは、様々な周期の波が発生され地中を伝搬していくが、軟らかい堆積物が厚く積もっている地盤に入ると、一気に減衰する。"}, {"id": 3, "text": "軟弱地盤の上に建てられている高層ビルの固有周期と一致すると共振現象を起こし、ビルは長時間ゆらゆらと大きく揺れ続ける。特に、海溝型の巨大地震の場合、震源域から遠い平野にある都市部でそのような事態が発生すると予想される。"}], "correct_answer": 3}, {"question_number": 4, "question": "津波の伝播速度に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "津波の速さは、原因となった地震などの規模によって変化する。"}, {"id": 2, "text": "津波の速さは海の深さと関係する。太平洋の平均水深約4,000メートルでは時速約700キロメートルというジェット機並みのスピードとなる。"}, {"id": 3, "text": "津波の速さは、地震の規模や海の深さに関わりなく、一定時速約100キロメートルである。"}], "correct_answer": 2}, {"question_number": 5, "question": "津波の特徴に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "津波は何波もくる。第一波が終わったからといって油断してはならない。"}, {"id": 2, "text": "津波は川に入ると、流れてくる川の水とエネルギーを相殺するので、河口部で止まる。"}, {"id": 3, "text": "津波は湾口から湾奥に向かって低くなる。"}], "correct_answer": 1}, {"question_number": 6, "question": "南海トラフ地震に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "南海トラフ地震想定震源域は東海・東南海・南海である。"}, {"id": 2, "text": "南海トラフ地震防災対策推進地域として、関東から沖縄までの29都府県707市町村が指定されている。"}, {"id": 3, "text": "南海トラフ地震の発生と同時に、四国地域の活断層自身が必ず連動して発生すると考えられている。"}], "correct_answer": 2}, {"question_number": 7, "question": "内水氾濫に関する記述のうち、正しいものはどれか。", "choices": [{"id": 1, "text": "堤防が決壊して川の水が流入することを「内水氾濫」という。"}, {"id": 2, "text": "ハザードマップを見て、対策をしておけば心配がない。"}, {"id": 3, "text": "大量に降った雨が排水施設の処理能力を上回ったために、市街地にあふれ出して起こる現象を「内水氾濫」という。"}], "correct_answer": 3}, {"question_number": 8, "question": "台風に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "台風の強さの階級において、「猛烈な」台風と表現されるのは、10分間の平均風速が54m/s以上となることが条件である。"}, {"id": 2, "text": "台風の「大きさ」は、風速17.2m/s以上の強風域の半径により定義される。"}, {"id": 3, "text": "中心付近の風速が17.2m/sを超えたときに、「熱帯低気圧」から「台風」へと名称が変わる。"}], "correct_answer": 3}, {"question_number": 9, "question": "台風の特性に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "進行方向に向かって右方向のほうが、左方向に比べて風が弱い。"}, {"id": 2, "text": "上陸しなくても前線停滞で大雨になることがある。"}, {"id": 3, "text": "中心が最も風が強い。"}], "correct_answer": 2}, {"question_number": 10, "question": "高潮災害に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "台風の低い気圧によって1 hPa（ヘクトパスカル）下がることで海面を1 cm上昇させる「吸い上げ効果」と、台風の東側で強まる南風によって海水を陸地側に運ぶ「吹き寄せ」効果が高潮を発生させる。"}, {"id": 2, "text": "台風の接近が満潮時刻と重ならない見通しを持てたら、防災行動をとる体制のレベルを多少緩和させてもよい。"}, {"id": 3, "text": "地球温暖化の長期的な影響の評価によって、海面水位の上昇が予測される一方、熱帯低気圧の発生数の減少も予測され、高潮災害の危険性は少なくなった。"}], "correct_answer": 1}, {"question_number": 11, "question": "土石流に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "「土石流」とは、大量の土砂が空気を媒体として流下するもので、地表との摩擦が小さいため速度が大きくなる結果、運動エネルギーが大きくなり、破壊力も大きくなる。"}, {"id": 2, "text": "土石流の流速は20～40 km/hで土砂と水が一体となった連続体の流れである。また渓床勾配によって、土石流が発生する区間や流下する区間及び堆積する区間が分かれる。"}, {"id": 3, "text": "斜面から小石がパラパラ落ちてくる、斜面にある樹木の根が切れるなどの音がする等の前兆現象がある。"}], "correct_answer": 2}, {"question_number": 12, "question": "深層崩壊に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "地すべり、がけ崩れ、土石流などで崩れたり流されたりした大量の土砂が、川をふさいで水の流れをせき止めたのち、決壊すること。"}, {"id": 2, "text": "山崩れ・がけ崩れなどの斜面崩壊のうち、すべり面が表層崩壊よりも深部で発生し、表土層だけでなく深層の地盤までが崩壊土塊となる大規模な崩壊のこと。"}, {"id": 3, "text": "山崩れ・がけ崩れなどの斜面崩壊のうち、厚さ0.5～2.0m程度の表土層が、表土層と基盤層の境界に沿って滑落する比較的規模の小さな崩壊のこと。"}], "correct_answer": 2}, {"question_number": 13, "question": "活火山に関する記述のうち、正しいものはどれか。", "choices": [{"id": 1, "text": "活火山とは、現在も活発な噴火活動をしているものをいう。"}, {"id": 2, "text": "活火山とは、最近１千年間に噴火したことがあるか、現在も活発な噴火活動をしているものをいう。"}, {"id": 3, "text": "活火山とは、最近１万年間に噴火したことがあるか、現在も活発な噴火活動をしているものをいう。"}], "correct_answer": 3}, {"question_number": 14, "question": "火砕流に関する記述のうち、正しいものはどれか。", "choices": [{"id": 1, "text": "火口から流出したマグマが火山の斜面を流下する現象で、その温度は900℃から1,200℃の高温である。"}, {"id": 2, "text": "火山噴火で降り積もった火山灰などが、雨水を集めて大量の流水となり、これが噴出物とともに流れ出したものである。"}, {"id": 3, "text": "溶岩などを含む高温の粉体が、火山の斜面を高速で流れる現象をいい、内部温度は数百℃以上に達し、流下速度は時速100 kmを超えることもある。"}], "correct_answer": 3}, {"question_number": 15, "question": "2015年に改正された活動火山対策特別措置法（活火山法）に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "国や警察、消防、火山専門家などとともに「火山防災協議会」を置くよう義務付けられた。"}, {"id": 2, "text": "シェルターの設置が義務付けられた。"}, {"id": 3, "text": "集客施設や福祉施設等に対して避難確保計画の作成までは義務付けられていない。"}], "correct_answer": 1}, {"question_number": 16, "question": "阪神・淡路大震災と東日本大震災に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "木造家屋の延焼火災による犠牲者が８割以上を占めた。"}, {"id": 2, "text": "ショック死及び持病の悪化による犠牲者が７割を占めた。"}, {"id": 3, "text": "阪神・淡路大震災では、家屋・建物の倒壊による窒息死、圧死が８割以上を占め、東日本大震災では沿岸部で大津波に襲われ、死者・行方不明者は災害関連死を含め２万人を超えている。"}], "correct_answer": 3}, {"question_number": 17, "question": "緊急地震速報に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "最大震度５弱以上の揺れが予想されたときに、「緊急地震速報（警報）」、または「緊急地震速報」として発表する。"}, {"id": 2, "text": "マグニチュード７以上と予想されたときに「緊急地震速報（警報）」として発表する。"}, {"id": 3, "text": "最大震度４以上またはマグニチュード４以上等と予想されたときには「緊急地震速報（予報）」として発表する。"}], "correct_answer": 1}, {"question_number": 18, "question": "津波警報・注意報に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "津波の高さを正確に予測して通知できる。"}, {"id": 2, "text": "津波の高さ予想は５段階に区分され、３～５ｍの津波の場合、津波警報が発表される。"}, {"id": 3, "text": "マグニチュード8.0を超える巨大地震の場合、「巨大」という言葉を使った大津波警報で、非常事態であることを伝える。"}], "correct_answer": 3}, {"question_number": 19, "question": "噴火警戒レベルに関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "全ての活火山で導入されている。"}, {"id": 2, "text": "火山活動の状況に応じて「警戒が必要な範囲」と防災機関や住民等の「とるべき防災対応」を３段階に区分したものである。"}, {"id": 3, "text": "住民や登山者・入山者などに必要な防災対応がわかりやすいように、各区分にそれぞれキーワードを付けて警戒を呼び掛けるものである。"}], "correct_answer": 3}, {"question_number": 20, "question": "「ハザードマップ」に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "ゲリラ豪雨の増加で、浸水被害の半数以上を内水氾濫が占めるようになった状況のもと、「内水ハザードマップ」がほぼすべての市町村で公表されている。"}, {"id": 2, "text": "東日本大震災における甚大な被害を受けて、「津波ハザードマップ」の整備が、地震や火山噴火、水害などのハザードマップに比べ大幅に進んだ。"}, {"id": 3, "text": "ハザードマップで浸水想定区域を示すと、浸水想定区域外の住民にとっては、あたかも行政が安全を保障してくれたと勘違いする傾向がある。"}], "correct_answer": 3}, {"question_number": 21, "question": "パニックが起きるのは一定の条件が満たされたときと考えられている。パニック及びパニック防止に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "危険が差し迫り、全員が脱出不可能で助かる見込みがないという絶望的な状況でのみパニックは起きる。"}, {"id": 2, "text": "危険が差し迫り、全員が脱出不可能で助かる見込みがないという状況ではパニックは起きないとされる。"}, {"id": 3, "text": "パニックを防ぐには、危険が差し迫っていることを隠した方が良い。"}], "correct_answer": 2}, {"question_number": 22, "question": "危機管理に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "情報も意思決定もトップダウンで決定するのが良い。"}, {"id": 2, "text": "情報はボトムアップ（下からの意見を吸い上げて全体をまとめていく管理）、意思決定はトップダウンが良い。"}, {"id": 3, "text": "情報はボトムアップ、意思決定はその時の状況で指示するのが良い。"}], "correct_answer": 2}, {"question_number": 23, "question": "「罹災証明書」に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "「罹災証明書」は、各種の被災者支援施策の要件とされる住家の被害程度を証明するもので、国が交付する証明書である。"}, {"id": 2, "text": "「罹災証明書」は、被災者からの申請に基づき市町村が被災状況の現地調査等を行い、確認した事実に基づき交付する証明書である。"}, {"id": 3, "text": "罹災証明書により証明される住家の被害程度としては、「全壊」「半壊」等があり、木造住宅にのみ適用される。"}], "correct_answer": 2}, {"question_number": 24, "question": "阪神・淡路大震災では行政機関も被災し、災害対応力には限界があった。阪神・淡路大震災における行政の災害対応について正しいのはどれか。", "choices": [{"id": 1, "text": "自治体が対応できたのは発災後半日程度経過してからであったが、その間に若干被害が拡大したものの、２日目からはほぼ万全の対応ができた。"}, {"id": 2, "text": "行政も被災したが、生き埋めになった人々の９割以上は消防、警察、自衛隊が救出した。"}, {"id": 3, "text": "同時多発火災が発生し、消火活動を最優先とした消防隊出動がとられたが、出動途中で救出・救助の依頼に応じるのを得なかった。"}], "correct_answer": 3}, {"question_number": 25, "question": "仮設住宅の暮らしに関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "東日本大震災、熊本地震においては、仮設住宅の供給戸数のほとんどが「建設仮設住宅」であった。"}, {"id": 2, "text": "建設仮設住宅は、早期に供給する必要があるので、プレハブ建築のみである。"}, {"id": 3, "text": "みなし仮設住宅は、短期間で供給が可能、建設仮設住宅よりも居住水準が高い等のメリットがある反面、バラバラに住むことにより入居者が情報過疎に陥りやすい等のデメリットがある。"}], "correct_answer": 3}, {"question_number": 26, "question": "被災者生活再建支援法に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "支援金は全額国が負担する。"}, {"id": 2, "text": "支給対象世帯は「住宅が全壊した世帯」のみである。"}, {"id": 3, "text": "支給額は「住宅の被害程度に応じて支給する支援金（基礎支援金）」と「住宅の再建方法に応じて支給する支援金（加算支援金）」の合計額となる。"}], "correct_answer": 3}, {"question_number": 27, "question": "エコノミークラス症候群に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "車の中などで長時間同じ姿勢を続けることで血栓が生じ、その血栓が肺動脈などに詰まり肺塞栓症を引き起こし、呼吸不全を来たす病態である。"}, {"id": 2, "text": "避難所のスペースが乏しい場合、異なる家族が狭い場所に同居し、ストレスが生じやすいことを言う。"}, {"id": 3, "text": "長時間同じ姿勢を続けることで筋肉痛などが生じることを言う。生命に別状はない。"}], "correct_answer": 1}, {"question_number": 28, "question": "トリアージに関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "救護所に到着した順番に治療を行う。"}, {"id": 2, "text": "軽症者から順番に治療を行う。"}, {"id": 3, "text": "死者や救命不可能な重症者に治療の優先権を与えないことが重要。"}], "correct_answer": 3}, {"question_number": 29, "question": "災害時の医療救護活動において行われる「トリアージ」に関連する次の記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "「トリアージタグ」では、上から０＝黒、Ⅰ＝赤、Ⅱ＝緑、Ⅲ＝黄の４色の順に並べてそれぞれの色で治療の優先度を示している。"}, {"id": 2, "text": "「トリアージタッグ」では、上から０＝黒、Ⅰ＝緑、Ⅱ＝黄、Ⅲ＝赤の４色の順に並べてそれぞれの色で治療の優先度を示している。"}, {"id": 3, "text": "「トリアージタッグ」では、上から０＝黒、Ⅰ＝赤、Ⅱ＝黄、Ⅲ＝緑の４色の順に並べてそれぞれの色で治療の優先度を示している。"}], "correct_answer": 3}, {"question_number": 30, "question": "「クラッシュシンドローム」に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "四肢の圧迫を受けて、数時間経過した人については、筋肉は４～６時間で不可逆性の壊死に陥るため、一刻も早く圧迫しているものを取り除くのが良い。"}, {"id": 2, "text": "四肢の圧迫を受けて、数時間経過した人については、救急隊や医師が到着するまで、圧迫を受けている手足を冷やして、血流を抑えるように努める。"}, {"id": 3, "text": "四肢の圧迫を受けて、数時間経過した人については、圧迫を除く前に止血帯や駆血帯で圧迫し、血流を再開させないように処置しなければならない。"}], "correct_answer": 3}, {"question_number": 31, "question": "「大規模地震発生時の電気による２次災害」に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "「電気火災」は、地震の揺れで切断されて垂れ下がった屋外の電線が樹木や戸外の可燃物に接触して発生する火災を指す。"}, {"id": 2, "text": "混乱や停電の状況下で、機器のスイッチを切る、プラグを抜く、ブレーカーを切るなどの処置をせずに自宅から避難し、後日送電の再開時に火災となるケースを「通電火災」という。"}, {"id": 3, "text": "一度水に浸かった電気器具は、漏電事故を起こさないために、中の配線部分の水分が十分に乾いていることを確認してから再利用する。"}], "correct_answer": 2}, {"question_number": 32, "question": "災害時には上下水道も被害が生ずることがある。上水道の被害、復旧に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "過去の大規模地震では、主に取水、導水施設に被害が発生し、１か月以上断水することとなった。"}, {"id": 2, "text": "阪神・淡路大震災では、配水管に多くの被害が発生したが、これは配水管の耐震性、とりわけ管の継ぎ手部における破損、抜け出しなどの原因が大きかった。"}, {"id": 3, "text": "大規模地震であっても下水道施設に被害が及ぶことは考えにくい。水洗トイレの使用はまったく問題がない。"}], "correct_answer": 2}, {"question_number": 33, "question": "災害用伝言ダイヤルに関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "災害用伝言ダイヤルの電話番号は７１１である。"}, {"id": 2, "text": "災害用伝言ダイヤルの利点は、一度の録音で複数の人が確認できるため、効率的に安否確認ができる。"}, {"id": 3, "text": "災害用伝言ダイヤルで問題になるところは、災害が実際に発生したときにしか利用することができず、必要な時に正しく扱うことができないかもしれないことである。"}], "correct_answer": 2}, {"question_number": 34, "question": "「帰宅困難者」に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "2013年に国が発表した首都直下地震の被害想定では、首都圏の１都４県で約640万人～800万人の帰宅困難者が発生すると予測されているが、鉄道・バス・海上輸送の体制が整備されているので大きな混乱は生じない。"}, {"id": 2, "text": "2022年に東京都が発表した首都直下地震の被害想定では、都内で453万人が帰宅困難者になると予想された。"}, {"id": 3, "text": "阪神・淡路大震災の教訓のもとに体制が整備されたことにより、首都直下地震が発生した場合であっても、トイレ不足の心配はないと考えられる。"}], "correct_answer": 2}, {"question_number": 35, "question": "BCP（事業継続計画）に関する記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "BCPは危機管理部門の社員が中心となって策定するもので、BCPについて理解していない企業の代表者は関わらないほうがよい。"}, {"id": 2, "text": "従来の防災計画と事業継続計画とでは、策定や実践時にあたって中核となる部門や視点に違いが存在するが、達成の度合いを測る指標は「死傷者数」や「物的損害額」等で共通である。"}, {"id": 3, "text": "連鎖的な事業中断リスクが国内外に増大するなか、サプライチェーンの一員として取引先から事業継続計画策定を要請されるケースも増えている。"}], "correct_answer": 3}, {"question_number": 36, "question": "ガス使用時に地震が起きた場合の留意点について、正しいのはどれか。", "choices": [{"id": 1, "text": "火災を防ぐため、揺れている中でも速やかにガス栓を閉めて回ることが重要である。"}, {"id": 2, "text": "まずは自分の身を守ることに専念し、揺れが落ち着いてから火の始末をする。"}, {"id": 3, "text": "マイコンメーターによって自動的にガスが遮断されるため、確認しなくてもよい。"}], "correct_answer": 2}, {"question_number": 37, "question": "外出先で大規模な地震に見舞われた。それぞれの場面でとるべき防災行動についての記述のうち、正しいのはどれか。", "choices": [{"id": 1, "text": "地下街にいたときは、壁や太い柱に身を寄せて、頭をかばんなどで守る。揺れがおさまったら停電になる前にエスカレーターを使って地上に向かう。"}, {"id": 2, "text": "劇場や映画館にいたときは、天井が落下する危険があるので、かばんなどで頭を保護し、シートの間などに身を寄せて身を守る。係員に指示に従い落ち着いて行動する。"}, {"id": 3, "text": "街の中にいたときは、ブロック塀や電柱に身を寄せて、頭をかばんなどで守る。落下物 /* ==========================================================
   現在の問題番号
   ========================================================== */

let currentIndex = 0;


/* ==========================================================
   問題表示
   ========================================================== */

function showQuestion(index) {

    const q = questions[index];


    /* ------------------------------------------------------
       問題番号
       ------------------------------------------------------ */

    document
        .getElementById("questionNumber")
        .textContent =
            "問題 " + q.question_number;


    /* ------------------------------------------------------
       問題文
       ------------------------------------------------------ */

    document
        .getElementById("questionText")
        .textContent =
            q.question;


    /* ------------------------------------------------------
       正解
       ------------------------------------------------------ */

    document
        .getElementById("correctAnswer")
        .textContent =
            "正解： " + q.correct_answer;


    /* ------------------------------------------------------
       選択肢
       ------------------------------------------------------ */

    const choicesElement =
        document.getElementById("choices");


    choicesElement.innerHTML = "";


    q.choices.forEach(
        function(choice) {

            const choiceDiv =
                document.createElement("div");


            choiceDiv.className =
                "choice";


            /* 選択肢番号 */

            const numberDiv =
                document.createElement("div");


            numberDiv.className =
                "choice-number";


            numberDiv.textContent =
                choice.id + "．";


            /* 選択肢本文 */

            const textDiv =
                document.createElement("div");


            textDiv.className =
                "choice-text";


            textDiv.textContent =
                choice.text;


            /* 結合 */

            choiceDiv.appendChild(
                numberDiv
            );


            choiceDiv.appendChild(
                textDiv
            );


            choicesElement.appendChild(
                choiceDiv
            );

        }
    );


    /* ------------------------------------------------------
       進捗表示
       ------------------------------------------------------ */

    document
        .getElementById("progress")
        .textContent =
            (index + 1) +
            " / " +
            questions.length +
            " 問";


    /* ------------------------------------------------------
       前へボタン
       ------------------------------------------------------ */

    document
        .getElementById("prevButton")
        .disabled =
            (index === 0);


    /* ------------------------------------------------------
       次へボタン
       ------------------------------------------------------ */

    document
        .getElementById("nextButton")
        .disabled =
            (
                index ===
                questions.length - 1
            );


    /* ------------------------------------------------------
       問題番号ジャンプ
       ------------------------------------------------------ */

    document
        .getElementById("jumpSelect")
        .value = index;


    /* ------------------------------------------------------
       コピー状態をリセット
       ------------------------------------------------------ */

    const copyButton =
        document.getElementById(
            "copyButton"
        );


    copyButton.textContent =
        "問題をコピー";


    copyButton.classList.remove(
        "copied"
    );


    /* ------------------------------------------------------
       ページ上部へ
       ------------------------------------------------------ */

    window.scrollTo(
        0,
        0
    );
}


/* ==========================================================
   次の問題
   ========================================================== */

function nextQuestion() {

    if (
        currentIndex <
        questions.length - 1
    ) {

        currentIndex++;

        showQuestion(
            currentIndex
        );
    }
}


/* ==========================================================
   前の問題
   ========================================================== */

function previousQuestion() {

    if (
        currentIndex > 0
    ) {

        currentIndex--;

        showQuestion(
            currentIndex
        );
    }
}


/* ==========================================================
   問題番号ジャンプ
   ========================================================== */

function jumpToQuestion(value) {

    currentIndex =
        Number(value);


    showQuestion(
        currentIndex
    );
}


/* ==========================================================
   問題番号リスト作成
   ========================================================== */

function createJumpList() {

    const select =
        document.getElementById(
            "jumpSelect"
        );


    questions.forEach(
        function(q, index) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                index;


            option.textContent =
                "問題 " +
                q.question_number;


            select.appendChild(
                option
            );

        }
    );
}


/* ==========================================================
   問題コピー
   ==========================================================
   
   コピーするもの：
   ・問題番号
   ・問題文
   ・選択肢
   
   コピーしないもの：
   ・正解
   ========================================================== */

async function copyQuestion() {

    const q =
        questions[currentIndex];


    let text = "";


    /* 問題番号 */

    text +=
        "問題" +
        q.question_number +
        "\n";


    /* 問題文 */

    text +=
        q.question +
        "\n\n";


    /* 選択肢 */

    q.choices.forEach(
        function(choice) {

            text +=
                choice.id +
                "．" +
                choice.text +
                "\n";

        }
    );


    /* ------------------------------------------------------
       クリップボードへコピー
       ------------------------------------------------------ */

    try {

        await navigator.clipboard.writeText(
            text
        );


        const button =
            document.getElementById(
                "copyButton"
            );


        button.textContent =
            "コピーしました ✓";


        button.classList.add(
            "copied"
        );


        setTimeout(
            function() {

                button.textContent =
                    "問題をコピー";


                button.classList.remove(
                    "copied"
                );

            },
            1500
        );


    } catch (error) {

        /* --------------------------------------------------
           clipboard APIが使えない場合の予備処理
           -------------------------------------------------- */

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.left =
            "-9999px";


        document.body.appendChild(
            textarea
        );


        textarea.select();


        try {

            document.execCommand(
                "copy"
            );


            alert(
                "問題をコピーしました。"
            );


        } catch (e) {

            alert(
                "コピーに失敗しました。\n\n" +
                text
            );

        }


        document.body.removeChild(
            textarea
        );

    }
}


/* ==========================================================
   キーボード操作
   ========================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        /* セレクト操作中は無視 */

        if (
            event.target.tagName ===
            "SELECT"
        ) {

            return;
        }


        /* 右矢印 */

        if (
            event.key ===
            "ArrowRight"
        ) {

            nextQuestion();

        }


        /* 左矢印 */

        else if (
            event.key ===
            "ArrowLeft"
        ) {

            previousQuestion();

        }

    }
);


/* ==========================================================
   初期化
   ========================================================== */

createJumpList();

showQuestion(
    currentIndex
);

</script>


</body>

</html>
