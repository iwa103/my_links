const byId=()=>Object.fromEntries(data.presentations.map(p=>[p.id,p]));
function setMode(m){mode=m;$('tabSchedule').classList.toggle('active',m==='schedule');$('tabSearch').classList.toggle('active',m==='search');$('leftHeading').textContent=m==='schedule'?'タイムテーブル':'検索結果';$('rightHeading').textContent=m==='schedule'?'発表一覧':'発表詳細候補';$('query').placeholder=m==='schedule'?'発表番号・タイトル・発表者・所属を検索':'発表タイトル・発表者・発表番号を検索';renderSessions();renderResults();}
function renderSessions(){let root=$('sessionList');root.innerHTML='';if(mode==='search'){root.innerHTML='<div class="empty">上の検索欄にキーワードを入力してください。<br>タイトル・発表者・所属・発表番号を検索できます。</div>';return;}let days=[['2026-11-26','11月26日（木）'],['2026-11-27','11月27日（金）']];for(const [date,label] of days){let h=document.createElement('div');h.className='daytitle';h.textContent=label;root.appendChild(h);for(const s of data.sessions.filter(x=>x.date===date)){let b=document.createElement('button');b.className='session'+(selectedSession===s.id?' selected':'');b.innerHTML=`<div class="stime">${esc(s.start)}–${esc(s.end)} <span class="smeta">${esc(s.venue)}</span></div><div class="sname">${esc(s.title)}</div><div class="smeta">${s.codes.length?esc(s.codes[0]+'〜'+s.codes[s.codes.length-1])+' ・ '+s.codes.length+'件':esc(s.note||'発表リストなし')}</div>`;b.onclick=()=>{selectedSession=s.id;renderSessions();renderResults();$('detail').style.display='none';};root.appendChild(b);}}}
function card(p){return `<article class="talk" tabindex="0" data-id="${esc(p.id)}"><div><span class="talkid">${esc(p.id)}</span><span class="byline">${esc(p.author)}${p.affiliation?' ／ '+esc(p.affiliation):''}</span></div><div class="talktitle">${esc(p.title)}</div><div class="byline">${esc(p.date_label||'')} ${esc(p.start||'')}–${esc(p.end||'')}　${esc(p.venue||'')} ${p.session_title?'・'+esc(p.session_title):''}</div></article>`;}
function bindCards(){document.querySelectorAll('.talk').forEach(el=>{const go=()=>showDetail(el.dataset.id);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});}
function renderResults(){let root=$('results'),q=$('query').value.trim().toLowerCase(),lookup=byId();if(mode==='schedule'){let s=data.sessions.find(x=>x.id===selectedSession);if(!s){root.innerHTML='<div class="empty">左側のセッションを選択してください。</div>';return;}let talks=s.codes.map(c=>lookup[c]).filter(Boolean);root.innerHTML=`<div class="result-head"><h3>${esc(s.title)}</h3><p>${esc(s.date_label)} ${esc(s.start)}–${esc(s.end)} ／ ${esc(s.venue)} ${s.note?'／'+esc(s.note):''}</p><p>${talks.length}件の発表</p></div>`+(talks.length?talks.map(card).join(''):'<div class="empty">このセッションには発表番号付きの発表リストがありません。</div>');}else{let found=data.presentations.filter(p=>[p.id,p.author,p.affiliation,p.title,p.session_title].join(' ').toLowerCase().includes(q));root.innerHTML=`<div class="result-head"><h3>検索結果</h3><p>${found.length}件</p></div>`+(found.length?found.map(card).join(''):'<div class="empty">該当する発表はありません。</div>');}bindCards();}
function showDetail(id){let p=byId()[id];if(!p)return;let d=$('detail');d.style.display='block';d.innerHTML=`<span class="talkid">${esc(p.id)}</span><h2>${esc(p.title)}</h2><div class="detailgrid"><div class="label">発表者</div><div>${esc(p.author)}</div><div class="label">所属</div><div>${esc(p.affiliation||'—')}</div><div class="label">日時</div><div>${esc(p.date_label||'日時未設定')} ${esc(p.start||'')}–${esc(p.end||'')}</div><div class="label">会場</div><div>${esc(p.venue||'—')}</div><div class="label">セッション</div><div>${esc(p.session_title||'—')}</div></div>${p.session_id?'<p><button id="jumpSession">このセッションをタイムテーブルで表示</button></p>':''}`;d.scrollIntoView({behavior:'smooth',block:'nearest'});if(p.session_id)$('jumpSession').onclick=()=>{setMode('schedule');selectedSession=p.session_id;renderSessions();renderResults();d.style.display='none';};}
$('tabSchedule').onclick=()=>setMode('schedule');$('tabSearch').onclick=()=>setMode('search');$('query').addEventListener('input',()=>{if(mode==='schedule'&&$('query').value.trim()){setMode('search');}else renderResults();});$('jsonFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{let next=JSON.parse(await f.text());if(!Array.isArray(next.sessions)||!Array.isArray(next.presentations))throw Error('sessions / presentations がありません');data=next;selectedSession=null;renderSessions();renderResults();alert('JSONを読み込みました。');}catch(err){alert('JSONを読み込めませんでした: '+err.message);}});
renderSessions();renderResults();
</script></body></html>
